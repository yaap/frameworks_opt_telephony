syntax = "proto2";

package telephonyPinStorage;

option java_package = "com.android.internal.telephony";
option java_outer_classname = "StoredPinProto";

// Stores information about PIN of a SIM card.
message StoredPin {
    // Status of the PIN.
    enum PinStatus {
        // The PIN code is stored, but cannot be used for automatic verification.
        AVAILABLE = 1;

        // The PIN code is stored and will be usable for automatic verification after the
        // unattended reboot is completed.
        REBOOT_READY = 2;

        // The PIN code is stored and can be used for automatic verification.
        VERIFICATION_READY = 3;
    }

    // ICCID of the SIM card
    optional string iccid = 1;

    // PIN code
    optional string pin = 2;

    // Slot number
    optional int32 slot_id = 3;

    // Status of the PIN code
    optional PinStatus status = 4;

    // Boot count when the proto was generated.
    optional int32 boot_count = 5;
}

// Stores the encrypted version of StoredPin.
message EncryptedPin {
    // Encrypted StoredPin
    optional bytes encrypted_stored_pin = 1;

    // Initialization vector
    optional bytes iv = 2;
}

// Stores the PIN of a SIM card when the platform manages that PIN. In such a case,
// the old PIN is also stored for when the user turns this off.
message PlatformManagedPin {
    // ICCID of the SIM card
    optional string iccid = 1;

    // PIN code
    optional string pin = 2;

    // The old SIM PIN, for restoring when the user turns the feature off.
    optional string old_pin = 3;
}

message PlatformManagedPins {
    // A collection of platform-managed PINs. We have multiple since a user
    // can enroll multiple SIM cards into automatic PIN management, and we
    // need to keep all of them.
    repeated PlatformManagedPin pins = 1;
}

// Holds an encrypted PlatformManagedPins instance and the initialization
// vector needed for decryption.
message EncryptedPlatformManagedPins {
    // Encrypted PlatformManagedPins
    optional bytes encrypted_platform_pins = 1;

    // Initialization vector
    optional bytes iv = 2;
}
